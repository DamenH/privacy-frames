<!doctype html>
<html lang="en" class="imported-root">

    <base href="./assets/" />
    <title>Ordinary document</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="imported-document">
    <h1>Ordinary document</h1>

</html>
