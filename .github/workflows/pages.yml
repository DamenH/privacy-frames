name: Test and publish host
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Use the Ubuntu HTTPS archive for browser dependencies
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors-security.txt > /dev/null
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - run: npm test
      - run: npm run test:lifecycle
      - run: npm run test:review
      - run: npm run test:storage-policy
      - run: npm run test:mobile
      - run: npm run test:wasm
      - run: npm run test:compatibility
      - name: Provide virtual audio for native Firefox playback
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils strace
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=privacy_frames_test
          pactl set-default-sink privacy_frames_test
      - run: npm run test:pitch
      - run: npm run test:network
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: results/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-manager
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
