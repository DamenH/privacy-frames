name: Test and publish host
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLISHER_URL: ${{ vars.PUBLISHER_URL }}
      - run: node --test test/policy.test.mjs
      - uses: actions/checkout@v6
        if: vars.PAGES_ENABLED == 'true'
        with:
          repository: DamenH/privacy-frames-apps
          path: test/apps
          ssh-key: ${{ secrets.APPS_DEPLOY_KEY }}
      - run: npx playwright install --with-deps chromium firefox
        if: vars.PAGES_ENABLED == 'true'
      - run: npm test
        if: vars.PAGES_ENABLED == 'true'
        env:
          APPS_DIRECTORY: ${{ github.workspace }}/test/apps/apps
      - run: npm run test:pitch
        if: vars.PAGES_ENABLED == 'true'
        env:
          APPS_DIRECTORY: ${{ github.workspace }}/test/apps/apps
      - run: command -v strace || sudo apt-get install -y strace
        if: vars.PAGES_ENABLED == 'true'
      - run: npm run test:network
        if: vars.PAGES_ENABLED == 'true'
        env:
          APPS_DIRECTORY: ${{ github.workspace }}/test/apps/apps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: results/
      # The manager must not trust unrelated GitHub project paths as clients.
      # Pages remains an entry point to its dedicated static origin.
      - run: npm run build
        env:
          MANAGER_URL: https://pf.damenh.com/
          RUNTIME_URL: https://pf-runtime.damenh.com/
          MANAGER_ORIGINS: '["https://pf.damenh.com"]'
          HOST_CONFIG: deployment/config.json
          PUBLISHER_URL: ${{ vars.PUBLISHER_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
